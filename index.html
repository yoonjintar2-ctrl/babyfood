<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이유식 식단표</title>
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2316181d'/%3E%3Cpath d='M9 15h14a7 7 0 0 1-14 0z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body data-mtab="plan">
<header class="top">
  <div class="brand">이유식 식단표</div>
  <div class="wnav">
    <button id="prevW" class="ib bd" aria-label="이전 주">‹</button>
    <button id="todayW" class="btn sm">오늘</button>
    <button id="nextW" class="ib bd" aria-label="다음 주">›</button>
  </div>
  <div class="legend hl"><span class="s-short">부족</span><span class="s-ready"><i></i>재료 준비 완료</span><span class="s-done">✓ 완성</span></div>
  <div class="tr">
    <button id="sync" class="sync" type="button"></button>
    <button id="addBtn" class="btn dark">+ 식단 추가</button>
    <button id="setBtn" class="avatar" aria-label="계정"></button>
  </div>
</header>

<div id="pasteBar" class="pastebar" hidden role="status"></div>

<nav class="mtabs" aria-label="화면 전환">
  <button class="on" data-mtab="plan">식단표</button>
  <button data-mtab="fridge">냉장고 · 장보기 <span class="shop-count"></span></button>
</nav>

<main class="layout">
  <div id="plan"></div>

  <aside id="side">
    <div class="sh"><h2>냉장고 <span id="fcount" class="cnt"></span></h2></div>
    <form id="fadd" class="fadd" autocomplete="off">
      <div class="acw fnm"><input id="fname" class="in" placeholder="재료 추가 (예: 애호박)" aria-label="재료 이름"></div>
      <input id="fqty" class="in q" inputmode="decimal" placeholder="수량" aria-label="수량">
      <select id="funit" class="in u" aria-label="단위"></select>
      <button class="btn">추가</button>
    </form>
    <div id="fridgeList"></div>

    <div class="divider"></div>
    <div class="sh"><h2>장보기 <span class="cnt shop-count"></span></h2><button id="shopCopy" class="tbtn">목록 복사</button></div>
    <div class="shsub">아직 안 만든 메뉴 기준 · 냉장고에 없는 만큼</div>
    <div id="shopList"></div>
  </aside>
</main>

<div id="auth" class="auth" hidden>
  <div class="abox">
    <div class="abrand">이유식 식단표</div>
    <div class="atabs"><button type="button" data-amode="in">로그인</button><button type="button" data-amode="up">가입</button></div>
    <form id="authf" novalidate>
      <label class="lb" for="aid">아이디</label>
      <input id="aid" class="in" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="영문·숫자 3~20자">
      <label class="lb" for="apw">비밀번호</label>
      <input id="apw" class="in" type="password" placeholder="6자 이상">
      <div id="apw2w"><label class="lb" for="apw2">비밀번호 확인</label>
      <input id="apw2" class="in" type="password" autocomplete="new-password" placeholder="한 번 더"></div>
      <div id="amsg" class="amsg" role="alert"></div>
      <button id="asub" class="btn pri big">로그인</button>
    </form>
    <p class="anote">가입한 사람은 모두 같은 식단표를 함께 봐요.</p>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/match.js"></script>
<script src="js/data.js"></script>
<script src="js/nutrition.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
</html>
